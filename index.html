<style>
:root{
  --ink:#22315a; --ink-soft:#6b7ea6; --blue:#2f5cf0; --card-1:#3f74ff; --card-2:#2848cf; --line:#dbe6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 460px at 50% -8%, #ffffff 0%, rgba(255,255,255,0) 62%),
    linear-gradient(180deg,#e9f3ff 0%, #f5faff 44%, #edf5ff 100%);
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
  touch-action:manipulation;
}
body::before{
  content:"";position:fixed;left:-12%;top:16%;width:64vw;height:64vw;max-width:420px;max-height:420px;
  background:radial-gradient(closest-side,rgba(255,255,255,.85),rgba(255,255,255,0));
  pointer-events:none;z-index:0;
}
button{font-family:inherit;cursor:pointer}
.app{
  position:relative;z-index:1;max-width:480px;margin:0 auto;
  padding:calc(8px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom));
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
}
.topbar{display:flex;align-items:center;justify-content:center;padding:4px 0 3px}
.topbar h1{
  margin:0;flex:1 1 auto;min-width:0;text-align:center;
  font-size:clamp(17px,5.2vw,23px);font-weight:900;line-height:1.2;
  letter-spacing:-.05em;white-space:nowrap;color:#1f46c4;
  text-shadow:0 1px 0 #fff,0 2px 0 rgba(255,255,255,.7),0 6px 14px rgba(47,92,240,.22);
}
.topbar h1 .hh{
  color:#ff5f95;font-weight:900;font-size:.94em;vertical-align:.02em;padding:0 .03em;
  text-shadow:0 1px 0 #fff,0 2px 0 rgba(255,255,255,.7),0 6px 14px rgba(255,95,149,.28);
}
.toptools{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:0 1px 4px}
.toptools .iconbtn{width:29px;height:29px;border-radius:10px}
.toptools .iconbtn svg{width:16px;height:16px}
.iconbtn{
  width:36px;height:36px;flex:0 0 auto;border-radius:12px;border:none;background:#fff;
  box-shadow:0 4px 12px rgba(58,96,180,.14);color:#3a6bd6;display:grid;place-items:center;padding:0;
  transition:transform .1s;
}
.iconbtn:active{transform:scale(.93)}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.off{color:#9aa9c6}

main{flex:1;display:flex;flex-direction:column;min-height:0}
.playview{display:flex;flex-direction:column;flex:1;min-height:0}
.cardspace{display:flex;flex-direction:column;justify-content:center;flex:1;min-height:0}

.mascots{
  display:flex;justify-content:center;align-items:flex-end;gap:2px;
  margin:0 0 -24px;position:relative;z-index:0;pointer-events:none;
}
.mascot{width:100px;height:92px;filter:drop-shadow(0 8px 12px rgba(60,90,160,.18))}
.mascot.bear{width:94px;height:88px;margin-bottom:3px}
.bob{animation:bob 3.4s ease-in-out infinite}
.bob2{animation:bob 3.9s ease-in-out .35s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.mascots[data-mood="happy"] .mascot{animation:hop .55s ease}
.mascots[data-mood="sad"] .mascot{animation:tremble .5s ease}
.mascots[data-mood="focus"] .mascot{animation:pulse 1.1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-13px) rotate(-3deg)}70%{transform:translateY(-4px)}}
@keyframes tremble{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

.face{display:none}
.mascots[data-mood="idle"] .face-idle,
.mascots[data-mood="focus"] .face-focus,
.mascots[data-mood="secret"] .face-secret,
.mascots[data-mood="happy"] .face-happy,
.mascots[data-mood="sad"] .face-sad{display:block}
.sparkle{opacity:0;transition:opacity .2s}
.mascots[data-mood="idle"] .sparkle{opacity:1;animation:twinkle 2.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}

.card{
  position:relative;background:linear-gradient(165deg,var(--card-1) 0%,#2a55e6 58%,var(--card-2) 100%);
  border-radius:30px;padding:26px 16px 28px;color:#fff;overflow:hidden;
  box-shadow:0 20px 36px -12px rgba(38,70,200,.55), inset 0 2px 0 rgba(255,255,255,.22);
  text-align:center;
}
.card::after{
  content:"";position:absolute;left:-30%;right:-30%;bottom:-58%;height:70%;
  background:radial-gradient(closest-side,rgba(255,255,255,.18),rgba(255,255,255,0));
  pointer-events:none;
}
.card.pop{animation:pop .4s ease}
.card.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}

.modeTag{
  position:relative;z-index:2;display:inline-block;background:rgba(255,255,255,.2);
  border-radius:999px;padding:5px 13px;font-size:11.5px;font-weight:900;letter-spacing:-.01em;
  color:#eaf2ff;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.clockwrap{position:relative;z-index:2;display:flex;align-items:baseline;justify-content:center;gap:4px;margin:6px 0 0}
.clock{
  font-size:clamp(54px,18vw,72px);font-weight:900;line-height:1.06;letter-spacing:-.055em;
  font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(10,30,110,.18);
  transition:color .15s;
}
.clock.masked{color:#dbe7ff;letter-spacing:.01em;opacity:.92}
.clock.counting{font-size:clamp(64px,22vw,88px);color:#fff;animation:countPop .5s ease}
@keyframes countPop{0%{transform:scale(.55);opacity:.2}60%{transform:scale(1.14)}100%{transform:scale(1);opacity:1}}
.clockwrap .clockunit{font-size:clamp(15px,4.4vw,18px);font-weight:900;opacity:.85}
.targetline{position:relative;z-index:2;margin-top:2px;font-size:14px;font-weight:900;color:#dce8ff;letter-spacing:-.01em}
.targetline b{color:#fff;font-size:16.5px;font-variant-numeric:tabular-nums}
.clocknote{
  position:relative;z-index:2;margin-top:7px;font-size:12px;font-weight:800;color:#c8daff;
  min-height:32px;line-height:1.35;
}

.beststrip{
  align-self:center;margin:12px 0 0;max-width:100%;padding:7px 13px;border-radius:999px;
  background:rgba(255,255,255,.82);box-shadow:0 4px 12px rgba(58,96,180,.1);
  font-size:11.5px;font-weight:800;color:#5b76a8;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.beststrip b{color:#2a55e6;font-variant-numeric:tabular-nums}

.chips{display:flex;gap:5px;margin:11px 0 0}
.chip{
  flex:1 1 0;min-width:0;border:none;border-radius:14px;background:#fff;color:#5b76a8;
  padding:9px 4px 8px;font-size:clamp(10px,2.95vw,11.5px);font-weight:900;letter-spacing:-.035em;
  box-shadow:0 3px 10px rgba(58,96,180,.1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:transform .1s,background .15s,color .15s;
}
.chip:active{transform:scale(.96)}
.chip.active{background:linear-gradient(180deg,#5a8bff,#3b62ff);color:#fff;box-shadow:0 5px 14px rgba(59,98,255,.32)}
.chip small{display:block;font-size:9px;font-weight:800;opacity:.72;margin-top:1px;letter-spacing:-.02em}

.action{
  margin:10px 0 0;width:100%;height:66px;border-radius:22px;border:none;color:#fff;
  font-size:22px;font-weight:900;letter-spacing:-.01em;
  background:linear-gradient(160deg,#8ed6ff 0%,#5a8bff 46%,#6a5cff 100%);
  box-shadow:0 8px 0 #2b46c7, 0 18px 28px -10px rgba(48,78,200,.6);
  transition:transform .08s, box-shadow .08s, background .2s;
}
.action small{display:block;font-size:11px;font-weight:800;opacity:.86;margin-top:1px;letter-spacing:-.01em}
.action:active{transform:translateY(5px);box-shadow:0 3px 0 #2b46c7}
.action.run{background:linear-gradient(160deg,#ff9db2 0%,#ff5f7e 48%,#ef3f63 100%);box-shadow:0 8px 0 #b32444,0 18px 28px -10px rgba(220,60,100,.5)}
.action.run:active{box-shadow:0 3px 0 #b32444}
.action.cancel{background:linear-gradient(160deg,#cfe0ff,#a9c2f0 60%,#93b0e6);color:#2a3f6b;box-shadow:0 8px 0 #7b93c2}
.action.cancel:active{box-shadow:0 3px 0 #7b93c2}

.tips{margin:9px 0 0;text-align:center;font-size:11px;font-weight:700;color:#93a3c2;letter-spacing:-.01em}

.resultview{padding-top:2px}
.resultcard{background:#fff;border-radius:30px;padding:22px 18px 20px;box-shadow:0 20px 44px -16px rgba(56,92,170,.4);text-align:center}
.badge{
  font-size:44px;line-height:1;margin:0 auto 4px;width:76px;height:76px;border-radius:50%;
  display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#fff6da,#ffe6a8);
  box-shadow:0 8px 18px rgba(220,170,60,.28);animation:pop .45s ease;
}
.resultcard h2{margin:6px 0 0;font-size:21px;font-weight:900;letter-spacing:-.03em}
.resultcard .sub{margin:4px 0 0;font-size:12px;color:#93a3c2;font-weight:800}
.resultStats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0 8px}
.resultStats div{background:#f2f7ff;border-radius:16px;padding:9px 3px}
.resultStats span{display:block;font-size:10.5px;color:#8ba0c2;font-weight:800;margin-bottom:3px}
.resultStats b{font-size:15.5px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.diffline{margin:2px 0 0;font-size:13.5px;font-weight:900;color:#2a55e6;min-height:19px}
.scoreline{display:flex;align-items:baseline;justify-content:center;gap:3px;margin:2px 0 0}
.scoreline b{font-size:27px;font-weight:900;font-variant-numeric:tabular-nums;color:#1f46c4;letter-spacing:-.03em}
.scoreline small{font-size:12px;font-weight:900;color:#8ba0c2}
.bestline{margin:6px 0 0;font-size:12px;color:#7d90b3;font-weight:800;min-height:18px;line-height:1.4}
.bestline .new{display:inline-block;margin-left:5px;background:#fff0d6;color:#c9761c;border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:900}
.resultButtons{display:grid;gap:8px;margin-top:13px}
.btn{border:none;border-radius:18px;height:50px;font-size:15.5px;font-weight:900;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#eef4ff;color:#3a63c9}
.btn.solid{background:linear-gradient(160deg,#5a8bff,#3b62ff);color:#fff;box-shadow:0 6px 0 #2b46c7}
.btn.solid:active{box-shadow:0 3px 0 #2b46c7;transform:translateY(3px)}
.btn.share{background:#fff;color:#3a63c9;border:2px solid #dbe6ff}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(255,255,255,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(198,215,242,.8);
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 24px rgba(60,90,150,.08);
}
.tabs{display:flex;gap:2px;width:100%;max-width:480px;margin:0 auto}
.tab{
  flex:1 1 0;min-width:0;border:none;background:none;border-radius:14px;padding:5px 0 6px;
  display:flex;flex-direction:column;align-items:center;gap:1px;color:#8a9ab8;font-weight:800;position:relative;
}
.tab .tn{font-size:clamp(12px,3.5vw,15px);font-weight:900;line-height:1.15;letter-spacing:-.04em;white-space:nowrap}
.tab .tl{font-size:9.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab .mark{position:absolute;top:1px;right:calc(50% - 25px);font-size:9.5px;line-height:1;color:#ffb72b}
.tab.active{background:linear-gradient(180deg,#eaf2ff,#dae8ff);color:#2a55e6}
.tab.active .tl{color:#4f6ea8}

.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.spark{position:absolute;width:9px;height:9px;animation:fall 1.3s ease-out forwards}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx,0),70vh) rotate(520deg)}}

.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(34,49,90,.94);color:#fff;padding:11px 18px;border-radius:999px;
  font-size:12.5px;font-weight:800;z-index:50;max-width:88vw;text-align:center;
  box-shadow:0 10px 24px rgba(20,40,90,.28);animation:toastIn .18s ease;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

.sheetmask{position:fixed;inset:0;z-index:40;background:rgba(28,46,90,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:#fff;border-radius:26px 26px 0 0;width:100%;max-width:480px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -18px 40px rgba(20,40,90,.24);max-height:82vh;overflow:auto;
}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.sheethead b{font-size:16px;font-weight:900;letter-spacing:-.02em}
.sheetclose{border:none;background:#eef4ff;color:#3a63c9;border-radius:12px;padding:7px 12px;font-size:12px;font-weight:900}
.sheetnote{margin:10px 0 6px;font-size:11px;font-weight:900;color:#93a3c2;letter-spacing:-.01em}
.besttable{display:grid;gap:5px}
.bestrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:#f6f9ff;border-radius:13px;padding:9px 11px}
.bestrow .m{font-size:13px;font-weight:900;color:#2a3f6b}
.bestrow .m small{display:block;font-size:9.5px;color:#93a3c2;font-weight:800}
.bestrow .e{font-size:12.5px;font-weight:900;font-variant-numeric:tabular-nums;color:#2a55e6}
.bestrow .s{font-size:11px;font-weight:900;color:#8ba0c2;min-width:44px;text-align:right}
.bestrow.none{color:#9aa9c6}

<script>
(function () {
  'use strict';
  var STORE = 'wangjeonTimer.v1';
  var COUNT_MS = 3000;          /* 3·2·1 countdown before the clock runs */
  var PERFECT_MS = 50;          /* 0.05초 이내 = 퍼펙트 */
  var MAXEXTRA_MS = 30000;      /* target + 30초를 넘기면 자동 종료 */
  var PEEK_RATIO = 0.3;         /* 잠깐 보기: 목표의 30%까지만 숫자 공개 */

  var MODES = [
    { id: 'm5',   name: '5초',    short: '5초',    sub: '초보 도전',    ms: 5000,  sec: 5 },
    { id: 'm777', name: '7.77초', short: '7.77초', sub: '행운 도전',    ms: 7770,  sec: 7.77 },
    { id: 'm10',  name: '10초',   short: '10초',   sub: '국민 챌린지',  ms: 10000, sec: 10 },
    { id: 'm15',  name: '15초',   short: '15초',   sub: '집중 도전',    ms: 15000, sec: 15 },
    { id: 'm20',  name: '20초',   short: '20초',   sub: '인내왕',       ms: 20000, sec: 20 },
    { id: 'rnd',  name: '랜덤',   short: '랜덤',   sub: '매판 새 목표', ms: 0,     sec: 0 }
  ];
  var DIFFS = [
    { id: 'peek',     name: '잠깐 보기',       short: '잠깐', ratio: PEEK_RATIO, note: '처음 30%까지만 숫자가 보여요' },
    { id: 'hard',     name: '처음부터 안 보기', short: '하드', ratio: 0,         note: '시작하자마자 숫자가 가려져요' },
    { id: 'practice', name: '계속 보기',       short: '연습', ratio: 1,         note: '연습용, 숫자가 계속 보여요' }
  ];
  var GRADES = [
    { max: 50,       emoji: '👑', name: '전설의 인간시계', msg: '이건 진짜 감각이다!' },
    { max: 150,      emoji: '✨', name: '소름 돋는 감각!', msg: '와, 거의 다 맞았어!' },
    { max: 300,      emoji: '🔥', name: '거의 완벽!',     msg: '아주 좋아, 이 느낌이야!' },
    { max: 600,      emoji: '👍', name: '굿 타이밍',      msg: '좋았어! 한 번 더 해 보자!' },
    { max: 1200,     emoji: '🐣', name: '조금만 더!',     msg: '거의 다 왔어, 다시 도전!' },
    { max: Infinity, emoji: '🌱', name: '다음엔 더 잘할 수 있어', msg: '괜찮아, 감각은 늘어나!' }
  ];

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function modeById(id) { for (var i = 0; i < MODES.length; i++) { if (MODES[i].id === id) { return MODES[i]; } } return MODES[2]; }
  function diffById(id) { for (var i = 0; i < DIFFS.length; i++) { if (DIFFS[i].id === id) { return DIFFS[i]; } } return DIFFS[0]; }
  function gradeFor(errMs) {
    var a = Math.abs(errMs), i;
    for (i = 0; i < GRADES.length - 1; i++) { if (a <= GRADES[i].max) { return GRADES[i]; } }
    return GRADES[GRADES.length - 1];
  }
  function scoreFor(errMs) {
    /* 부드럽게 줄어드는 점수: 0ms=1000점, 0.5초≈930점, 1초≈240점… 아주 크게 틀려도 0점은 아니에요(아이들 사기). */
    var a = Math.abs(errMs);
    if (a === 0) { return 1000; }
    return clamp(Math.round(1000 * Math.exp(-a / 700)), 1, 1000);
  }
  function fmtSec(sec) {
    if (!isFinite(sec) || sec < 0) { sec = 0; }
    var cs = Math.floor(sec * 100 + 1e-7);
    return pad(Math.floor(cs / 100)) + '.' + pad(cs % 100);
  }
  function fmtClock(ms) { return fmtSec(ms / 1000); }
  function errText(errMs) {
    if (errMs === 0) { return { value: '딱 0.00초', note: '완벽!!', gap: '0ms' }; }
    var a = Math.abs(errMs);
    return {
      value: (errMs < 0 ? '-' : '+') + (a / 1000).toFixed(2) + '초',
      note: a + 'ms ' + (errMs < 0 ? '빠름!' : '늦음!'),
      gap: a + 'ms'
    };
  }
  function keyOf(modeId, diffId) { return modeId + '|' + diffId; }

  /* ---------- timing ---------- */
  function nowMs() {
    if (window.performance && typeof window.performance.now === 'function') { return window.performance.now(); }
    return Date.now();
  }
  function raf(fn) {
    if (typeof window.requestAnimationFrame === 'function') { return window.requestAnimationFrame(fn); }
    return setTimeout(fn, 16);
  }
  function cancelRaf(id) {
    if (!id) { return; }
    if (typeof window.cancelAnimationFrame === 'function') { window.cancelAnimationFrame(id); return; }
    clearTimeout(id);
  }

  /* ---------- random mode ---------- */
  /* Nice, readable targets: whole seconds, halves, and the lucky .77 / .88
     endings, always inside 3.00~15.00초 and never the same twice in a row. */
  function randomPool() {
    var pool = [], s, endings = [0, 50, 77, 88];
    for (s = 3; s <= 15; s++) {
      for (var e = 0; e < endings.length; e++) {
        var cs = s * 100 + endings[e];
        if (cs >= 300 && cs <= 1500) { pool.push(cs * 10); }   /* 3.00~15.00초만 */
      }
    }
    return pool;
  }
  var RANDOM_POOL = randomPool();
  function randomTarget(rand, prevMs) {
    var r = (typeof rand === 'function') ? rand : Math.random;
    var pick = RANDOM_POOL[Math.floor(r() * RANDOM_POOL.length) % RANDOM_POOL.length];
    var guard = 0;
    while (prevMs && pick === prevMs && guard++ < 12) {
      pick = RANDOM_POOL[Math.floor(r() * RANDOM_POOL.length) % RANDOM_POOL.length];
    }
    return pick;

      if (S.state === 'idle') { start(); }
      else if (S.state === 'count') { cancelCount(); }
      else if (S.state === 'run') { stop(); }
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && (S.state === 'count' || S.state === 'run')) { abortHidden(); }
    });
    document.addEventListener('pointerdown', function () { audioUnlocked = true; }, { once: true });
  }

  function init() {
    var stored = readStore();
    save.best = stored.best || {};
    save.recent = stored.recent || [];
    save.muted = !!stored.muted;
    if (stored.modeId && modeById(stored.modeId).id === stored.modeId) { save.modeId = stored.modeId; }
    if (stored.diffId && diffById(stored.diffId).id === stored.diffId) { save.diffId = stored.diffId; }
    S.modeId = save.modeId;
    S.diffId = save.diffId;
    S.targetMs = S.modeId === 'rnd' ? randomTarget(Math.random, 0) : modeById(S.modeId).ms;
    applyMute();
    buildTabs();
    bind();
    setupManifest();
    prepareRound();
  }

  /* test hooks */
  window.__wangjeonTimer = {
    MODES: MODES, DIFFS: DIFFS, GRADES: GRADES, state: S, save: save,
    fmtSec: fmtSec, fmtClock: fmtClock, errText: errText, gradeFor: gradeFor, scoreFor: scoreFor,
    keyOf: keyOf, randomTarget: randomTarget, randomPool: randomPool, maskedNow: maskedNow,
    setMode: setMode, setDiff: setDiff, start: start, stop: stop, cancelCount: cancelCount,
    loop: loop, beginRun: beginRun, prepareRound: prepareRound, finish: finish, retry: retry,
    renderSheet: renderSheet, openSheet: openSheet, renderClock: renderClock, renderBestStrip: renderBestStrip,
    PERFECT_MS: PERFECT_MS, COUNT_MS: COUNT_MS, PEEK_RATIO: PEEK_RATIO, MAXEXTRA_MS: MAXEXTRA_MS
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
